name: Web milestone check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Web check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "fastapi>=0.116.0" "httpx>=0.28.1" "jinja2>=3.1.6" "pytest>=9.0.0" "SQLAlchemy>=2.0.45" "uvicorn[standard]>=0.35.0"

      - name: Run Phase 3 Web milestone check
        run: python scripts/web_check.py
