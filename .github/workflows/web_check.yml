name: MyInvest checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  db-first-and-web:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "baostock==0.9.1" "fredapi==0.5.2" "fastapi>=0.116.0" "httpx>=0.28.1" "jinja2>=3.1.6" "pandas>=3.0.1" "pytest>=9.0.0" "SQLAlchemy>=2.0.45" "tushare>=1.4.29" "uvicorn[standard]>=0.35.0" "yfinance==1.4.1"

      - name: Build DB-first history test database
        run: |
          python scripts/db_migrate.py --db temp/history_db/test_myinvest_history.sqlite3 --reset
          python scripts/db_ingest_research_artifacts.py --db temp/history_db/test_myinvest_history.sqlite3 --all

      - name: Run project checks
        run: |
          python scripts/project_check.py --current-only
          python scripts/project_check.py --current-only --db temp/history_db/test_myinvest_history.sqlite3 --db-strict

      - name: Run DB tests
        run: python -m pytest tests -q

      - name: Run Web tests with warnings as errors
        run: python -m pytest web/backend/tests -q -W error

      - name: Run Web smoke check
        run: python scripts/web_check.py --mode smoke
