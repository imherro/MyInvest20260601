<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyInvest Current</title>
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <style>
      :root {
        color-scheme: light;
        --ink: #18212f;
        --muted: #647084;
        --line: #d9dee7;
        --surface: #f6f8fb;
        --panel: #ffffff;
        --blue: #235ea8;
        --green: #0d7c66;
        --amber: #a35f00;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background: var(--surface);
        font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        letter-spacing: 0;
      }
      header {
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }
      .bar {
        max-width: 1200px;
        margin: 0 auto;
        padding: 14px 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }
      .brand {
        font-size: 18px;
        font-weight: 700;
        white-space: nowrap;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        justify-content: flex-end;
      }
      nav a {
        color: var(--muted);
        text-decoration: none;
        padding: 7px 9px;
        border-radius: 6px;
        font-size: 14px;
      }
      nav a.active,
      nav a:hover {
        color: var(--ink);
        background: #e9eef6;
      }
      main {
        max-width: 1200px;
        margin: 0 auto;
        padding: 22px 20px 48px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 28px;
        line-height: 1.2;
      }
      h2 {
        margin: 28px 0 10px;
        font-size: 18px;
      }
      .subtle { color: var(--muted); }
      .metric-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 10px;
        margin: 12px 0 22px;
      }
      .metric,
      .row-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
      }
      .metric strong {
        display: block;
        margin-top: 6px;
        font-size: 22px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        min-height: 24px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #eef6f3;
        color: var(--green);
        font-size: 13px;
        font-weight: 600;
      }
      .status.warn {
        background: #fff6e5;
        color: var(--amber);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      th, td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--line);
        text-align: left;
        vertical-align: top;
        font-size: 14px;
      }
      th {
        background: #edf2f8;
        color: #344052;
        font-weight: 650;
      }
      tr:last-child td { border-bottom: 0; }
      .num { text-align: right; font-variant-numeric: tabular-nums; }
      .stack {
        display: grid;
        gap: 10px;
      }
      .list {
        margin: 6px 0 0;
        padding-left: 18px;
      }
      .empty {
        padding: 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--muted);
      }
      @media (max-width: 720px) {
        .bar { align-items: flex-start; flex-direction: column; }
        nav { justify-content: flex-start; }
        table { display: block; overflow-x: auto; }
      }
    </style>
  </head>
  <body hx-boost="true">
    <header>
      <div class="bar">
        <div class="brand">MyInvest Current</div>
        <nav aria-label="Main">
          <a class="{{ 'active' if page == 'dashboard' else '' }}" href="/">Dashboard</a>
          <a class="{{ 'active' if page == 'action-plan' else '' }}" href="/action-plan">Action Plan</a>
          <a class="{{ 'active' if page == 'target-allocation' else '' }}" href="/target-allocation">Target Allocation</a>
          <a class="{{ 'active' if page == 'research-first' else '' }}" href="/research-first">ResearchFirst</a>
          <a class="{{ 'active' if page == 'portfolio' else '' }}" href="/portfolio">Portfolio</a>
          <a class="{{ 'active' if page == 'intraday-rules' else '' }}" href="/intraday-rules">Intraday Rules</a>
          <a class="{{ 'active' if page == 'decision-log' else '' }}" href="/decision-log">Decision Log</a>
          <a class="{{ 'active' if page == 'system-checks' else '' }}" href="/system-checks">System Checks</a>
        </nav>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
