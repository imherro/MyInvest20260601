{% extends "base.html" %}
{% block title %}Decision Log{% endblock %}
{% block content %}
  <div class="table-tools">
    <h2>Recent Entries</h2>
    <input type="search" placeholder="Search decision log" data-table-search="decisionTable">
  </div>
  <table id="decisionTable">
    <thead>
      <tr><th data-sort="text">Time</th><th>Summary</th></tr>
    </thead>
    <tbody id="decisionRows">
      {% for item in entries %}
        <tr><td>{{ item.entry_time or "" }}</td><td>{{ item.summary }}</td></tr>
      {% endfor %}
    </tbody>
  </table>
{% endblock %}
